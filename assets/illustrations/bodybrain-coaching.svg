<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000"><rect width="100%" height="100%" fill="#eeeade"/><g font-family="Arial,sans-serif" fill="#252d28"><text x="75" y="80" font-size="22" >BODYBRAIN / COACHING DIRECTION</text><text x="75" y="165" font-size="52" >A plan that learns with you.</text><text x="75" y="212" font-size="22" >Concept interface · fictional example · in development</text><rect x="70" y="265" width="810" height="660" rx="16" fill="#faf8f2"/><text x="110" y="327" font-size="32" >Weekly review</text><text x="110" y="370" font-size="23" >Training, food and recovery in one conversation.</text><text x="110" y="443" font-size="23" fill="#536637">01</text><text x="180" y="443" font-size="29" >Notice</text><text x="180" y="485" font-size="23" >Training is consistent; recovery varies.</text><text x="110" y="578" font-size="23" fill="#536637">02</text><text x="180" y="578" font-size="29" >Discuss</text><text x="180" y="620" font-size="23" >What changed outside the gym?</text><text x="110" y="713" font-size="23" fill="#536637">03</text><text x="180" y="713" font-size="29" >Adjust</text><text x="180" y="755" font-size="23" >Agree one change, then review next week.</text><rect x="920" y="265" width="410" height="660" rx="16" fill="#dbe2cf"/><text x="955" y="330" font-size="28" >The working thesis</text><text x="955" y="392" font-size="25" >Better context makes</text><text x="955" y="430" font-size="25" >better coaching possible.</text><text x="955" y="528" font-size="25" >The data starts a</text><text x="955" y="566" font-size="25" >conversation. A person</text><text x="955" y="604" font-size="25" >makes the judgement.</text><text x="955" y="820" font-size="21" >Active development</text></g></svg>