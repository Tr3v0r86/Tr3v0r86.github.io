<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000"><rect width="100%" height="100%" fill="#eeeade"/><g font-family="Arial,sans-serif" fill="#252d28"><text x="75" y="90" font-size="22" >PLJ DATABANK / FROM DOCUMENTATION TO REUSE</text><text x="75" y="174" font-size="48" >Keep the context with the content.</text><rect x="75" y="240" width="1250" height="126" rx="16" fill="#faf8f2"/><text x="103" y="289" font-size="23" >01 / EXTRACT</text><text x="420" y="287" font-size="28" >Photos, artwork, quotes</text><text x="420" y="331" font-size="22" >Preserve the source page</text><rect x="75" y="395" width="1250" height="126" rx="16" fill="#faf8f2"/><text x="103" y="444" font-size="23" >02 / ORGANISE</text><text x="420" y="442" font-size="28" >Classify and deduplicate</text><text x="420" y="486" font-size="22" >Keep original files available</text><rect x="75" y="550" width="1250" height="126" rx="16" fill="#dce4cd"/><text x="103" y="599" font-size="23" >03 / REVIEW</text><text x="420" y="597" font-size="28" >Ownership and attribution</text><text x="420" y="641" font-size="22" >Check quality and suitability</text><rect x="75" y="705" width="1250" height="126" rx="16" fill="#faf8f2"/><text x="103" y="754" font-size="23" >04 / REUSE</text><text x="420" y="752" font-size="28" >Publications and social media</text><text x="420" y="796" font-size="22" >An editor makes the final choice</text><text x="75" y="922" font-size="24" >Access is controlled by the hosting environment, not this static tool.</text></g></svg>