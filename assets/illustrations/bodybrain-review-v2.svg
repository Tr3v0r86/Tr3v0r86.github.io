<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200"><rect x="0" y="0" width="900" height="1200" fill="#fcfcf9" rx="0"/><rect x="0" y="0" width="15" height="1200" fill="#1f50ba" rx="0"/><text x="52" y="65" font-family="Arial" font-size="28" font-weight="700" fill="#17202a">bodybrain</text><text x="648" y="65" font-family="monospace" font-size="20" font-weight="400" fill="#59616d">REVIEW / 038</text><path d="M52 92L848 92" stroke="#ccd0d2" stroke-width="1" fill="none"/><text x="52" y="193" font-family="Georgia" font-size="63" font-weight="400" fill="#17202a">Start a conversation.</text><text x="52" y="256" font-family="Arial" font-size="26" font-weight="400" fill="#59616d">The measurements are only part of the story.</text><path d="M52 343L848 343" stroke="#ccd0d2" stroke-width="1" fill="none"/><text x="52" y="386" font-family="monospace" font-size="19" font-weight="400" fill="#1f50ba">01 / NOTICE</text><text x="52" y="444" font-family="Georgia" font-size="37" font-weight="400" fill="#17202a">A pattern worth discussing</text><text x="52" y="493" font-family="Arial" font-size="25" font-weight="400" fill="#59616d">Three training sessions are logged this week.</text><text x="52" y="533" font-family="Arial" font-size="20" font-weight="400" fill="#59616d">Source: Hevy · illustrative sample</text><path d="M52 565L848 565" stroke="#ccd0d2" stroke-width="1" fill="none"/><text x="52" y="608" font-family="monospace" font-size="19" font-weight="400" fill="#1f50ba">02 / CONTEXT</text><text x="52" y="666" font-family="Georgia" font-size="37" font-weight="400" fill="#17202a">What changed around it?</text><text x="52" y="715" font-family="Arial" font-size="25" font-weight="400" fill="#59616d">Work, sleep, travel, appetite, motivation.</text><text x="52" y="755" font-family="Arial" font-size="20" font-weight="400" fill="#59616d">Your note stays alongside the data.</text><path d="M52 787L848 787" stroke="#ccd0d2" stroke-width="1" fill="none"/><text x="52" y="830" font-family="monospace" font-size="19" font-weight="400" fill="#1f50ba">03 / AGREE</text><text x="52" y="888" font-family="Georgia" font-size="37" font-weight="400" fill="#17202a">One adjustment, together</text><text x="52" y="937" font-family="Arial" font-size="25" font-weight="400" fill="#59616d">Choose the next action with your coach.</text><text x="52" y="977" font-family="Arial" font-size="20" font-weight="400" fill="#59616d">Review what happened at the next check-in.</text><rect x="52" y="1054" width="796" height="60" fill="#1f50ba" rx="0"/><text x="278" y="1093" font-family="Arial" font-size="24" font-weight="400" fill="#fff">Save a note for review</text><text x="52" y="1160" font-family="monospace" font-size="17" font-weight="400" fill="#59616d">COACHING FLOW CONCEPT / NO MEDICAL INTERPRETATION</text></svg>