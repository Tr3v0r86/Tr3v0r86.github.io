<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200"><rect x="0" y="0" width="900" height="1200" fill="#282d59" rx="0"/><text x="44" y="69" font-family="monospace" font-size="24" font-weight="400" fill="#d6dbff">brain / builder</text><text x="44" y="154" font-family="Georgia" font-size="58" font-weight="400" fill="#fff">A starting point,</text><text x="44" y="222" font-family="Georgia" font-size="58" font-weight="400" fill="#fff">in plain text.</text><text x="44" y="283" font-family="Arial" font-size="25" font-weight="400" fill="#b9c1e4">A workspace shaped around the way you work.</text><rect x="44" y="336" width="812" height="728" fill="#fafbff" rx="7"/><text x="76" y="384" font-family="monospace" font-size="20" font-weight="400" fill="#414c9a">BLUEPRINT.md</text><path d="M76 405L824 405" stroke="#cbd0e2" stroke-width="1" fill="none"/><text x="77" y="448" font-family="monospace" font-size="22" font-weight="400" fill="#414c9a"># Working agreements</text><text x="77" y="484" font-family="monospace" font-size="22" font-weight="400" fill="#41465b"></text><text x="77" y="520" font-family="monospace" font-size="22" font-weight="400" fill="#41465b">01  Keep one current context note.</text><text x="77" y="556" font-family="monospace" font-size="22" font-weight="400" fill="#41465b">02  Give each project a next step.</text><text x="77" y="592" font-family="monospace" font-size="22" font-weight="400" fill="#41465b">03  Return to a weekly review.</text><text x="77" y="628" font-family="monospace" font-size="22" font-weight="400" fill="#41465b"></text><text x="77" y="664" font-family="monospace" font-size="22" font-weight="400" fill="#414c9a"># Folder outline</text><text x="77" y="700" font-family="monospace" font-size="22" font-weight="400" fill="#41465b"></text><text x="77" y="736" font-family="monospace" font-size="22" font-weight="400" fill="#41465b">projects/</text><text x="77" y="772" font-family="monospace" font-size="22" font-weight="400" fill="#41465b">routines/</text><text x="77" y="808" font-family="monospace" font-size="22" font-weight="400" fill="#41465b">notes/</text><text x="77" y="844" font-family="monospace" font-size="22" font-weight="400" fill="#41465b"></text><text x="77" y="880" font-family="monospace" font-size="22" font-weight="400" fill="#414c9a"># First action</text><text x="77" y="916" font-family="monospace" font-size="22" font-weight="400" fill="#41465b"></text><text x="77" y="952" font-family="monospace" font-size="22" font-weight="400" fill="#41465b">Choose one project to bring in.</text><rect x="44" y="1093" width="385" height="62" fill="#cbd2ff" rx="4"/><text x="102" y="1133" font-family="monospace" font-size="24" font-weight="400" fill="#282d59">Copy blueprint</text><text x="469" y="1133" font-family="monospace" font-size="24" font-weight="400" fill="#e3e7ff">Save .md ↓</text><text x="44" y="1180" font-family="monospace" font-size="15" font-weight="400" fill="#b9c1e4">OUTPUT STUDY / FICTIONAL EXAMPLE / NOT A PRIVATE BUILD</text></svg>